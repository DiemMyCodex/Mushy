name: CI & Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

jobs:
  build_debug:
    name: Build Universal GMS Debug
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Persistent Keystore
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Build Optimized Arm64 Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew assembleArm64GmsRelease \
            -Dorg.gradle.jvmargs="-Xmx4096M -XX:+UseParallelGC" \
            --no-configuration-cache \
            --console=plain \
            --warning-mode summary

      - name: Prepare Mushy APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk/ -name "*arm64*release*.apk" -exec cp {} dist/Mushy.apk \;
          ls -lh dist/

      - name: Upload Mushy APK
        uses: actions/upload-artifact@v4
        with:
          name: Mushy-APK
          path: dist/Mushy.apk
          retention-days: 7