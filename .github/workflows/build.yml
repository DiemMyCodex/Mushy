name: CI & Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

jobs:
  build_debug:
    name: Build Universal GMS Debug
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Optimized APKs (Release & Debug)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew assembleArm64GmsRelease assembleUniversalGmsRelease assembleArm64GmsDebug --no-configuration-cache --console=plain --warning-mode summary

      - name: Prepare Mushy APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/ -name "*arm64*release*.apk" -exec cp {} dist/Mushy-Arm64-Release.apk \;
          find app/build/outputs/apk/ -name "*universal*release*.apk" -exec cp {} dist/Mushy-Universal-Release.apk \;
          find app/build/outputs/apk/ -name "*arm64*debug*.apk" -exec cp {} dist/Mushy-Arm64-Debug.apk \;
          cp dist/Mushy-Arm64-Release.apk dist/Mushy.apk || cp dist/Mushy-Universal-Release.apk dist/Mushy.apk || true
          ls -lh dist/

      - name: Upload Mushy APKs
        uses: actions/upload-artifact@v4
        with:
          name: Mushy-APKs
          path: dist/*.apk